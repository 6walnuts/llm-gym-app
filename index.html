<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A0E1A">
<title>智能长卷 · 私人卷宗</title>
<style>
:root{color-scheme:dark}
html,body{margin:0;height:100%;background:#0A0E1A;color:#E8E4D8;
  font-family:"PingFang SC","Hiragino Sans GB",-apple-system,sans-serif}
.wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:min(400px,92vw);text-align:center}
h1{font-family:"Songti SC","Noto Serif SC",serif;font-weight:600;letter-spacing:.3em;
  font-size:30px;margin:0 0 6px;background:linear-gradient(100deg,#CE8A3F,#E8E4D8 50%,#8ADEE4);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.4em;color:#5C6578;margin-bottom:34px}
input[type=password]{width:100%;box-sizing:border-box;background:#0D1322;border:1px solid #33405E;border-radius:10px;
  color:#E8E4D8;font-size:17px;padding:14px 16px;text-align:center;letter-spacing:.2em;outline:none}
input[type=password]:focus{border-color:#CE8A3F}
button{width:100%;margin-top:14px;background:none;border:1px solid #CE8A3F;border-radius:10px;color:#E8E4D8;
  font-family:"Songti SC","Noto Serif SC",serif;font-size:16px;letter-spacing:.5em;padding:13px 0 13px 6px;cursor:pointer}
button:active{background:rgba(206,138,63,.15)}
label{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:16px;font-size:13px;color:#9AA3B5}
.err{min-height:20px;margin-top:14px;font-size:13px;color:#E07070}
.note{margin-top:26px;font-size:11.5px;color:#5C6578;line-height:1.8}
</style>
</head>
<body>
<div class="wrap"><form class="card" id="f">
  <h1>智能长卷</h1>
  <div class="sub">PRIVATE SCROLL · 口令解封</div>
  <input type="password" id="pw" placeholder="口令" autocomplete="current-password" autofocus>
  <button type="submit">展 卷</button>
  <label><input type="checkbox" id="rem" checked> 记住这台设备</label>
  <div class="err" id="err"></div>
  <div class="note">内容以 AES-256-GCM 加密存放，口令不经过任何服务器。</div>
</form></div>

9Q5CyRpzCkK/DGou5pt97QWLhewwTEMH2ipwOxootiEt5UDz6t5biAt4ZKNX8A++jizjqK3J",ITER=310000;
const un=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const errEl=document.getElementById('err');
if(!(crypto&&crypto.subtle)){errEl.textContent='需要 HTTPS（或 localhost）环境才能解密。';}
async function keyFromPw(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:un(SALT),iterations:ITER,hash:'SHA-256'},
    base,{name:'AES-GCM',length:256},true,['decrypt']);
}
async function tryOpen(key,remember){
  const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:un(IV)},key,un(CT));
  if(remember){try{const raw=await crypto.subtle.exportKey('raw',key);
    localStorage.setItem('llmscroll.gate',btoa(String.fromCharCode(...new Uint8Array(raw))))}catch(e){}}
  const html=new TextDecoder().decode(buf);
  document.open();document.write(html);document.close();
}
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();errEl.textContent='';
  try{const key=await keyFromPw(document.getElementById('pw').value);
    await tryOpen(key,document.getElementById('rem').checked)}
  catch(x){errEl.textContent='口令不对，卷轴未展。'}
});
(async()=>{ // 记住过的设备自动解封
  try{const saved=localStorage.getItem('llmscroll.gate');if(!saved)return;
    const key=await crypto.subtle.importKey('raw',un(saved),{name:'AES-GCM'},true,['decrypt']);
    await tryOpen(key,false);}
  catch(e){try{localStorage.removeItem('llmscroll.gate')}catch(x){}}
})();
</script>
